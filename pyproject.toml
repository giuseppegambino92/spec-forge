[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "spec-forge"
version = "1.0.0"
description = "Neuro-symbolic multi-agent code verification & self-healing synthesis engine (CEGIS + MCTS repair)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
specforge = "spec_forge.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
